name: transcendence

services:

  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./docker/frontend:/app # for dev hot-reloading
      - /app/node_modules # to prevent overwriting node_modules with the host's empty folder

  postgres:
    image: postgres:18.1-alpine3.23
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data

  nginx:
    image: nginx:1.0-alpine
    ports:
      - "443:443"
      - "8080:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/certs:/etc/nginx/ssl/:ro

  adminer:
    image: adminer:5.4.1-fastcgi
    expose:
      - "9000"
    restart: always

volumes:
  postgres-data:
server {
    listen 80;
    server_name localhost;

    location /adminer/ {
        root /var/www/html;
        index index.php;

        fastcgi_pass adminer:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    }

    location = /adminer {
        return 301 /adminer/;
    }
}

volumes:
  postgres-data:
    name: tr-postgres-prod

networks:
  main:
    name: tr-main-prod

services:

  nginx:
    image: tr-nginx:1.0-prod
    container_name: tr-nginx-prod
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
      target: prod
      args:
      - VITE_SOCKET_URL=${VITE_SOCKET_URL}
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_started
    networks:
      - main
    restart: unless-stopped

  api:
    image: tr-api:1.0-prod
    container_name: tr-api-prod
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
      target: prod
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - main
    restart: unless-stopped


  postgres:
    image: postgres:18.1-alpine3.23
    container_name: tr-postgres-prod
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

volumes:
  postgres-data:
    name: tr-postgres-data

networks:
  main:
    name: tr-main

services:

  nginx:
    image: tr-nginx:1.0
    container_name: tr-nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
      target: prod
    ports:
      - "80:80"
      - "443:443"
    networks:
      - main
    restart: unless-stopped

  client:
    image: tr-client:1.0
    container_name: tr-client
    build:
      context: ..
      dockerfile: docker/client/Dockerfile
      target: prod
    env_file: .env
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - main
    restart: unless-stopped

  api:
    image: tr-api:1.0
    container_name: tr-api
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
      target: prod
    env_file: .env
    environment:
       - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
       - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - main
    restart: unless-stopped


  postgres:
    image: postgres:18.1-alpine3.23
    container_name: tr-postgres
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

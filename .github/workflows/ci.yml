name: CI

# This workflow runs the project's Continuous Integration (CI) pipeline on
# GitHub Actions.
#
# Triggers:
# - Code is pushed to any branch or a Pull Request is opened toward 'develop'
#   or 'main'.
#
# Job Steps:
# 1. Based on 'ubuntu-22.04' to ensures the CI environment is stable and
#    reproducible over time.
# 2. Checkout the repository code (equivalent to 'git clone' and 'git checkout'
#    inside the temp test container)
# 3. Setup Node.js version 24.13.0 (same as in Dockerfiles) and caches npm
#    dependencies for speed
# 4. Install dependencies with `npm ci`
# 5. Run unit tests with coverage and end-to-end (e2e) tests. The unit tests
#    coverage threshold is set to 70% in package.json under `coverageThreshold`.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: "npm"
      - run: npm ci
      - run: npm run test:cov && npm run test:e2e

volumes:
  client-node-modules:
    name: tr-client-node-modules
  api-node-modules:
    name: tr-api-node-modules
  postgres-data:
    name: tr-postgres-data

networks:
  main:
    name: tr-main

services:

  nginx:
    image: tr-nginx:1.0
    container_name: tr-nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
      - "443:443"
    networks:
      - main

  client:
    image: tr-client:1.0
    container_name: tr-client
    build:
      context: ..
      dockerfile: docker/client/Dockerfile
      target: dev # change to 'prod' for production
    expose:
      - "5173"
    env_file: .env
    volumes:
      - ../client:/app # for dev hot-reloading
      - client-node-modules:/app/node_modules # to prevent overwriting node_modules with the host's empty folder
    depends_on:
      - api
    networks:
      - main

  api:
    image: tr-api:1.0
    container_name: tr-api
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
      target: dev # change to 'prod' for production
    ports:
      - "3000:3000" # API debug via curl or in browser
      - "3001:3001" # Prisma Studio
    env_file: .env
    environment:
       - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    volumes:
      - ../api:/app # for dev hot-reloading
      - api-node-modules:/app/node_modules # to prevent overwriting node_modules with the host's empty folder
    depends_on:
      - postgres
    networks:
      - main

  postgres:
    image: postgres:18.1-alpine3.23
    container_name: tr-postgres
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - main

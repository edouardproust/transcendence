volumes:
  postgres-data:
    name: tr-postgres-data

networks:
  main:
    name: tr-main

services:

  nginx:
    image: nginx:stable-alpine3.23
    container_name: tr-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/ssl/:ro
    networks:
      - main

  client:
    image: tr-client:1.0
    container_name: tr-client
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev # change to 'prod' for production
    env_file: .env
    depends_on:
      - api
    networks:
      - main

  api:
    image: tr-api:1.0
    container_name: tr-api
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev # change to 'prod' for production
    env_file: .env
    environment:
       - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      - postgres
    networks:
      - main

  postgres:
    image: postgres:18.1-alpine3.23
    container_name: tr-postgres
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - main

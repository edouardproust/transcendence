volumes:
  client-node-modules:
    name: tr-client-node-modules
  api-node-modules:
    name: tr-api-node-modules
  postgres-data:
    name: tr-postgres

networks:
  main:
    name: tr-main

services:

  nginx:
    image: tr-nginx:1.0
    container_name: tr-nginx
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
      target: dev
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - main
    restart: unless-stopped

  client:
    image: tr-client:1.0
    container_name: tr-client
    build:
      context: ..
      dockerfile: docker/client/Dockerfile
      target: dev
    expose:
      - "5173"
    env_file: .env
    environment:
      - NODE_ENV=development
    volumes:
      - ../client:/app:cached # for dev hot-reloading & cached for Windows & MacOS
      - client-node-modules:/app/node_modules # to prevent overwriting node_modules with the host's empty folder
    depends_on:
      - api
    networks:
      - main
    restart: unless-stopped

  api:
    image: tr-api:1.0
    container_name: tr-api
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
      target: dev
    ports:
      - "3000:3000" # API debug via curl or in browser
      - "3030:3030" # Prisma Studio
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - DATABASE_TEST_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/e2e_tests?schema=public
      - NODE_ENV=development
    volumes:
      - ../api:/app:cached # for dev hot-reloading & cached for Windows & MacOS
      - api-node-modules:/app/node_modules # to prevent overwriting node_modules with the host's empty folder
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - main
    restart: unless-stopped

  postgres:
    image: postgres:18.1-alpine3.23
    container_name: tr-postgres
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.dev.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
